name: PayloadLab CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files when absent
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name payloadlab .
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: payloadlab-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/payloadlab
